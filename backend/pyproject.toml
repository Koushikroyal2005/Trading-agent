[project]
name = "vector-trading-system"
version = "1.0.0"
description = "HDD-optimized multi-agent paper trading system"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = [".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
