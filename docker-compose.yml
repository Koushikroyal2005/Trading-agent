name: vector-trading
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vector}
    volumes:
      - ${HDD_STORAGE_PATH:-./runtime}/postgres:/var/lib/postgresql/data
      - ./infrastructure/docker/init-timescale.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--maxmemory", "500mb", "--maxmemory-policy", "allkeys-lru", "--save", "900", "1", "--dir", "/data"]
    volumes:
      - ${HDD_STORAGE_PATH:-./runtime}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 600M, cpus: "0.5" }
  api:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.backend }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vector}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-vector}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      HDD_STORAGE_PATH: /data
    volumes:
      - ${HDD_STORAGE_PATH:-./runtime}/app:/data
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
  worker:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.backend }
    restart: unless-stopped
    command: ["celery", "-A", "backend.tasks.celery:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vector}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-vector}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      HDD_STORAGE_PATH: /data
      INTERNAL_API_URL: http://api:8000
    volumes:
      - ${HDD_STORAGE_PATH:-./runtime}/app:/data
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
  scheduler:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.backend }
    restart: unless-stopped
    command: ["celery", "-A", "backend.tasks.celery:celery_app", "beat", "--loglevel=INFO", "--schedule=/data/celerybeat-schedule"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vector}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-vector}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      HDD_STORAGE_PATH: /data
      INTERNAL_API_URL: http://api:8000
    volumes:
      - ${HDD_STORAGE_PATH:-./runtime}/app:/data
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }
  frontend:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile.frontend }
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
